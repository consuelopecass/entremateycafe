<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ec" />
    <meta name="description" content="Entre Mate y Café: soluciones integrales de marketing, comunicaciones, diseño y tecnología para hacer avanzar tu negocio. Donde nacen las ideas." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Entre Mate y Café — Donde nacen las ideas" />
    <meta property="og:description" content="Marketing, comunicaciones, diseño y tecnología en soluciones adaptadas a tu negocio." />
    <title>Entre Mate y Café — Donde nacen las ideas</title>
    <link rel="icon" type="image/png" href="./src/assets/favicon.png" />
    <script>
      (() => {
        let theme = 'sun'
        try {
          const savedTheme = localStorage.getItem('emyc-theme')
          theme = savedTheme === 'sun' || savedTheme === 'moon'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'moon' : 'sun')
        } catch {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'moon' : 'sun'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'moon' ? '#142a23' : '#f6f4ec')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
