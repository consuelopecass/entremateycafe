    <link rel="icon" type="image/png" href="./src/assets/favicon.png" />
    <script>
      (() => {
        let theme = 'sun'
        try {
          const savedTheme = localStorage.getItem('emyc-theme')
          theme = savedTheme === 'sun' || savedTheme === 'moon'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'moon' : 'sun')
        } catch {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'moon' : 'sun'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'moon' ? '#142a23' : '#f6f4ec')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
